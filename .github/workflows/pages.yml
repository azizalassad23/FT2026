name: Deploy static site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # PNG sumber (~16 MB) tetap disimpan di repo sebagai arsip, tetapi tidak ikut
      # dipublikasikan karena halaman hanya memakai turunan .webp-nya.
      - name: Siapkan folder publikasi
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '.claude' --exclude '_site' --exclude '*.png' ./ _site/
          du -sh _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4